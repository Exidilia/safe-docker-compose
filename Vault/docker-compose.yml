services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault-prod
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=https://127.0.0.1:8200
      - VAULT_API_ADDR=https://yourdomain.com:8200
    volumes:
      - ./config:/vault/config:ro
      - ./certs:/vault/certs:ro
      - ./data:/vault/file
      - ./logs:/vault/logs
    ports:
      - "8200:8200"
      - "8201:8201" # Cluster port, only needed if you plan to add more nodes later
    command: vault server -config=/vault/config/vault.hcl
